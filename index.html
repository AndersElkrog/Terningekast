<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Terningeforsøg – Eksponentiel model</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}

#topControls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 10px;
}

#diceSelector {
    border: 2px solid #333;
    padding: 10px;
    border-radius: 12px;
    display: flex;
    justify-content: space-around;
    width: 350px;
    background-color: #f9f9f9;
}

.selectDie {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 2px solid #444;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
    background-color: white;
    transition: 0.2s;
}

.selectDie.selected {
    background-color:#1F7789;
    color: white;
}

#layout {
    display: flex;
    justify-content: center;
    gap: 40px;
    align-items: flex-start;
}

#diceContainer {
    display: grid;
    grid-template-columns: repeat(10, 50px);
    gap: 6px;
    margin-top: 20px;
}

.die {
    width: 40px;       /* tidligere 50px */
    height: 40px;      /* tidligere 50px */
    border: 2px solid black;
    border-radius: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 4px;      /* lidt mindre padding */
    background-color: white;
}

.dot {
    width: 7px;        /* tidligere 10px */
    height: 7px;       /* tidligere 10px */
    border-radius: 50%;
    background-color: black;
    justify-self: center;
    align-self: center;
    opacity: 0;
    transition: opacity 0.2s;
}

.marked {
    opacity: 0.5;
    background-color: #d3d3d3;
}

.dead {
    visibility: hidden;
}

#graphContainer {
    width: 450px;
}

#modelText {
    margin-bottom: 5px;
    font-weight: bold;
}

table {
    border-collapse: collapse;
    margin: 20px auto 40px auto; /* nu under hele layoutet */
}

td, th {
    border: 1px solid black;
    padding: 5px 10px;
}

button {
    font-size: 18px;
    padding: 8px 18px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Terningeforsøg</h2>

<div id="topControls">
  <h2>Vælg terninger der fjernes:</h2>
    <div id="diceSelector">
      <span class="selectDie">1</span>
        <span class="selectDie">2</span>
        <span class="selectDie">3</span>
        <span class="selectDie">4</span>
        <span class="selectDie">5</span>
        <span class="selectDie selected">6</span>
    </div>
    <button id="rollButton">Kast</button>
</div>

<div id="status"></div>

<div id="layout">
    <div>
        <div id="diceContainer"></div>
    </div>

    <div id="graphContainer">
        <div id="modelText"></div>
        <canvas id="myChart"></canvas>
    </div>
</div>

<!-- Tabellen flyttes under hele layoutet -->
<table>
    <tr id="xRow">
        <th>x</th>
        <td>0</td>
    </tr>
    <tr id="yRow">
        <th>y</th>
        <td>100</td>
    </tr>
</table>

<script>

let dice = [];
let round = 0;
let xValues = [0];
let yValues = [100];
let selectedFaces = new Set([6]); // kun 6'ere er valgt som default

const container = document.getElementById("diceContainer");
const button = document.getElementById("rollButton");
const status = document.getElementById("status");
const xRow = document.getElementById("xRow");
const yRow = document.getElementById("yRow");
const modelText = document.getElementById("modelText");

const diceSelector = document.getElementById("diceSelector");
diceSelector.querySelectorAll(".selectDie").forEach(d => {
    const value = parseInt(d.textContent);
    if (selectedFaces.has(value)) d.classList.add("selected");
    d.addEventListener("click", () => {
        const val = parseInt(d.textContent);
        if (selectedFaces.has(val)) {
            if (selectedFaces.size === 1) return; // mindst én skal være valgt
            selectedFaces.delete(val);
            d.classList.remove("selected");
        } else {
            selectedFaces.add(val);
            d.classList.add("selected");
        }
    });
});

// Prik-konfiguration for hver værdi
const dicePatterns = {
    1: [4],
    2: [0,8],
    3: [0,4,8],
    4: [0,2,6,8],
    5: [0,2,4,6,8],
    6: [0,2,3,5,6,8]
};

function showDice(dieObj, value) {
    // Skjul alle prikker først
    dieObj.dots.forEach(d => d.style.opacity = 0);
    // Tænd de prikker der skal vises
    dicePatterns[value].forEach(i => {
        dieObj.dots[i].style.opacity = 1;
    });
}

// Chart
const ctx = document.getElementById('myChart');

const myChart = new Chart(ctx, {
    type: 'scatter',
    data: {
        datasets: [
            {
                label: "Data",
                data: [{x:0,y:100}],
                showLine: false,
                pointRadius: 5
            },
            {
                label: "Regression",
                data: [],
                type: 'line',
                fill: false,
                borderWidth: 2,
                pointRadius: 0
            }
        ]
    },
    options: {
        maintainAspectRatio: true,
        aspectRatio: 0.8,
        scales: {
        x: {
    type: 'linear',
    suggestedMin: 0, // forsigtigt startpunkt, men undgår at klippe punktet
    title: { display: true, text: "Runde (x)" }
},
            y: {
                beginAtZero: true,
                title: { display: true, text: "Antal terninger (y)" }
            }
        }
    }
});

function createDice() {
    for (let i = 0; i < 100; i++) {
        const die = document.createElement("div");
        die.classList.add("die");

        // Opret 9 prikker (3x3 grid)
        let dots = [];
        for (let j = 0; j < 9; j++) {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            die.appendChild(dot);
            dots.push(dot);
        }

        container.appendChild(die);
        dice.push({ element: die, dots: dots, active: true, marked: false });
    }
    updateStatus(100);
}

function updateStatus(value) {
    status.textContent = `Runde: ${round} | Tilbageværende terninger: ${value}`;
}

function updateTableAndGraph(value) {

    const xCell = document.createElement("td");
    xCell.textContent = round;
    xRow.appendChild(xCell);

    const yCell = document.createElement("td");
    yCell.textContent = value;
    yRow.appendChild(yCell);

    xValues.push(round);
    yValues.push(value);

    myChart.data.datasets[0].data.push({x: round, y: value});

    exponentialRegression();

    myChart.update();
}

function exponentialRegression() {

    let filteredX = [];
    let filteredY = [];

    for (let i = 0; i < yValues.length; i++) {
        if (yValues[i] > 0) {
            filteredX.push(xValues[i]);
            filteredY.push(yValues[i]);
        }
    }

    if (filteredY.length < 2) return;

    let n = filteredX.length;
    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;

    for (let i = 0; i < n; i++) {
        let x = filteredX[i];
        let Y = Math.log(filteredY[i]);

        sumX += x;
        sumY += Y;
        sumXY += x * Y;
        sumX2 += x * x;
    }

    let slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
    let intercept = (sumY - slope * sumX) / n;

    let a = Math.exp(slope);
    let b = Math.exp(intercept);

    modelText.innerHTML =
        `Regression: f(x) = ${b.toFixed(2)} · ${a.toFixed(4)}<sup>x</sup>`;

    let regData = [];
    for (let x = 0; x <= round; x++) {
        regData.push({x: x, y: b * Math.pow(a, x)});
    }

    myChart.data.datasets[1].data = regData;
}

function rollDice() {

    // Fjern markerede
    dice.forEach(d => {
        if (d.marked) {
            d.active = false;
            d.element.classList.remove("marked");
            d.element.classList.add("dead");
        }
        d.marked = false;
    });

    const activeDice = dice.filter(d => d.active);

    if (activeDice.length === 0) {
        button.disabled = true;
        return;
    }

    activeDice.forEach(d => {
        const roll = Math.floor(Math.random() * 6) + 1;
        showDice(d, roll);

        if (selectedFaces.has(roll)) {
            d.marked = true;
            d.element.classList.add("marked");
        }
    });

    round++;

    const survivors = activeDice.filter(d => !d.marked).length;

    updateStatus(survivors);

    if (survivors > 0) {
        updateTableAndGraph(survivors);
    }

    if (survivors <= 1) {
        button.disabled = true;
    }
}

button.addEventListener("click", rollDice);

createDice();

</script>

</body>
</html>
